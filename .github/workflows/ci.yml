name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build (Fluid.Avalonia.Acrylic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Builds the whole solution: the library, the shared demo, and the Desktop + Browser
      # (WebAssembly) heads. wasm-tools is required to compile the net10.0-browser head.
      - name: Restore
        run: dotnet restore Fluid.Avalonia.Acrylic.slnx

      - name: Build
        run: dotnet build Fluid.Avalonia.Acrylic.slnx --configuration Release --no-restore
